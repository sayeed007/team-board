  #     postgres:
  #       condition: service_healthy
  #   environment:
  #     NODE_ENV: development
  #     PORT: 3000
  #     DATABASE_URL: postgresql://teamboard_user:teamboard_pass@postgres:5432/teamboard_dev
  #     JWT_SECRET: ${JWT_SECRET}
  #     CORS_ORIGIN: http://localhost:4200
  #   ports:
  #     - '3000:3000'
  #   volumes:
  #     - ./apps/api:/app/apps/api
  #     - ./libs:/app/libs
  #     - /app/node_modules
  #   networks:
  #     - teamboard-network
  #   command: npm run start:dev api

  # Frontend Web (Angular) - Uncomment for full Docker setup
  # web:
  #   build:
  #     context: .
  #     dockerfile: apps/web/Dockerfile
  #   container_name: teamboard-web
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   environment:
  #     VITE_API_URL: http://localhost:3000
  #   ports:
  #     - '4200:4200'
  #   volumes:
  #     - ./apps/web:/app/apps/web
  #     - ./libs:/app/libs
  #     - /app/node_modules
  #   networks:
  #     - teamboard-network
  #   command: npm run start:dev web

  # pgAdmin (Optional - Database Management UI)
