version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: teamboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamboard_user
      POSTGRES_PASSWORD: teamboard_pass
      POSTGRES_DB: teamboard_dev
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U teamboard_user -d teamboard_dev']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamboard-network

  # Backend API (NestJS) - Uncomment for full Docker setup
