version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: teamboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teamboard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamboard_pass}
      POSTGRES_DB: ${POSTGRES_DB:-teamboard_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-teamboard_user}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - teamboard-network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamboard-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-teamboard_user}:${POSTGRES_PASSWORD:-teamboard_pass}@postgres:5432/${POSTGRES_DB:-teamboard_dev}?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    networks:
      - teamboard-network
    volumes:
      - ./backend/prisma:/app/prisma
    command: sh -c "npx prisma migrate deploy && node dist/main"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend (Angular + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    networks:
      - teamboard-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # pgAdmin (Optional - Database Management UI)
  # Uncomment to use pgAdmin for database management
  # pgadmin:
  #   image: dpage/pgadmin4:latest
  #   container_name: teamboard-pgadmin
  #   restart: unless-stopped
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: admin@teamboard.com
  #     PGADMIN_DEFAULT_PASSWORD: admin
  #     PGADMIN_LISTEN_PORT: 5050
  #   ports:
  #     - '5050:5050'
  #   volumes:
  #     - pgadmin-data:/var/lib/pgadmin
  #   networks:
  #     - teamboard-network
  #   depends_on:
  #     - postgres

  # Redis (Optional - for caching and sessions)
  # Uncomment for future caching implementation
  # redis:
  #   image: redis:7-alpine
  #   container_name: teamboard-redis
  #   restart: unless-stopped
  #   ports:
  #     - '6379:6379'
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - teamboard-network
  #   command: redis-server --appendonly yes

volumes:
  postgres-data:
    driver: local
  # pgadmin-data:
  #   driver: local
  # redis-data:
  #   driver: local

networks:
  teamboard-network:
    driver: bridge
